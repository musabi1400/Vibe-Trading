# ---------------------------------------------------------------------------
# Vibe-Trading — REPLACE docker-compose.yml IN YOUR FORK WITH THIS FILE
#
# Why a fork and not Dokploy's "Raw" compose mode: Raw gives the compose file
# no source tree, so `build: .` has nothing to build. The only prebuilt image,
# ghcr.io/hkuds/vibe-trading:edge, was built 2026-06-08 — three months behind
# the repo, and there is no :latest tag. So Dokploy must use the Git provider
# against a repo you control, with the hardened compose committed inside it.
#
# Differences from upstream docker-compose.yml, and why:
#  * TRUST_DOCKER_LOOPBACK forced to 0. Upstream sets 1; _is_local_client() in
#    agent/src/api/security.py then treats anything arriving from the Docker
#    gateway as local and SKIPS API_AUTH_KEY. Under Dokploy every request
#    arrives that way, so 1 would mean an unauthenticated agent.
#  * No env_file / no ./agent/.env bind mount — Dokploy writes UI variables to
#    a .env beside this file, and ${VAR} interpolation below reads them.
#    (Trade-off: the Web UI Settings page can no longer persist changes; set
#    values in the Dokploy Environment tab and redeploy.)
#  * Host bind mounts replaced by named volumes (Dokploy manages the host FS).
#  * Port published on 127.0.0.1 only, and NO domain attached in Dokploy, so
#    Traefik never routes it from the internet. Reach it by SSH tunnel.
# All upstream hardening (read_only, cap_drop, no-new-privileges, limits) kept.
# ---------------------------------------------------------------------------
services:
  vibe-trading:
    build: .
    ports:
      - "127.0.0.1:8899:8899"
    environment:
      - API_AUTH_KEY=${API_AUTH_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      # --- safety switches: do not change without reading deploy/README.md ---
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=0
      - VIBE_TRADING_ENABLE_SHELL_TOOLS=0
      - VIBE_TRADING_ENABLE_SCHEDULER=0
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      - vibe-home:/home/vibe/.vibe-trading
      - vibe-swarm-runs:/app/agent/.swarm/runs
      - vibe-uploads:/app/agent/uploads
    cap_drop:
      - ALL
    # Kept on purpose: src/core/runner.py drops to the unprivileged
    # vibe-sandbox user before running LLM-generated backtest code.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /home/vibe/.cache
      - /home/vibe/.config
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  vibe-runs:
  vibe-sessions:
  vibe-home:
  vibe-swarm-runs:
  vibe-uploads:
